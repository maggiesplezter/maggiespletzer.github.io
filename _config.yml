# Jekyll configuration

name: Maggie Spletzer
title: Maggie Spletzer
author: Maggie Spletzer
tagline: photographer // engineer
description: Photography and software by Maggie Spletzer.

# Absolute site origin — used for canonical links and og: meta tags.
# Change this to your custom domain once DNS is set up in Cloudflare.
url: https://www.example.com

# Leave empty for an organization/user site (<org>.github.io) or a custom domain.
baseurl: ''

# GitHub user or org whose public repos appear on the GitHub page.
github_user: YOUR-GITHUB-USERNAME

# Sidebar links (rendered in this order).
# `icon` is a file name in assets/icons/ (any single-color SVG works).
links:
  - text: GitHub
    url: https://github.com/YOUR-GITHUB-USERNAME
    icon: github.svg
  - text: Instagram
    url: https://www.instagram.com/YOUR-INSTAGRAM/
    icon: instagram.svg
  - text: LinkedIn
    url: https://www.linkedin.com/in/YOUR-LINKEDIN/
    icon: linkedin.svg

# Your mark at the top of the sidebar (a cyanotype flower, shown as a circle).
# To change it, replace the file with any square image and update the path.
mark: /assets/images/mark.jpg

timezone: America/Detroit

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - _photos-inbox

sass:
  sass_dir: _sass
  style: compressed
