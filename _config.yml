# Jekyll configuration

name: Maggie Spletzer
title: Maggie Spletzer
author: Maggie Spletzer
tagline: photographer // engineer
description: Photography and software by Maggie Spletzer.

# url and baseurl are set automatically by the deploy workflow from GitHub
# Pages (today: https://mspletz.github.io + /maggiespletzer.github.io; with a
# custom domain: https://yourdomain.com + ''). These values are for local builds.
url: http://localhost:4000
baseurl: ''

# Your GitHub username — the "github" menu item links to github.com/<this>.
github_user: mspletz

# Sidebar links (rendered in this order).
# `icon` is a file name in assets/icons/ (any single-color SVG works).
links:
  - text: GitHub
    url: https://github.com/mspletz
    icon: github.svg
  - text: Instagram
    url: https://www.instagram.com/mspletz.jpeg/
    icon: instagram.svg
  - text: LinkedIn
    url: https://www.linkedin.com/in/maggie-c-hayes/
    icon: linkedin.svg

# Your mark at the top of the sidebar (a cyanotype flower, shown as a circle).
# To change it, replace the file with any square image and update the path.
mark: /assets/images/mark.jpg

timezone: America/Detroit

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - _photos-inbox

sass:
  sass_dir: _sass
  style: compressed
