# Build the Jekyll site, check its links and images, and deploy to GitHub Pages.
# Adapted from ryanspletzer/ryanspletzer.github.io.
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true # reads .ruby-version, runs bundle install, caches gems
          cache-version: 1

      # Ask GitHub where the site is published, so links work at
      # mspletz.github.io/maggiespletzer.github.io/ today and at the root of a
      # custom domain later, with no config changes. Falls back to the root
      # when Pages isn't enabled (e.g. on pull requests).
      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set site URL and base path
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          origin="$(printf '%s' "$BASE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
          {
            [ -n "$origin" ] && echo "url: \"$origin\""
            echo "baseurl: \"$BASE_PATH\""
          } > _config.ci.yml
          cat _config.ci.yml

      - name: Build with Jekyll
        run: bundle exec jekyll build --config _config.yml,_config.ci.yml
        env:
          JEKYLL_ENV: production

      - name: Check internal links and images
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          args=(--disable-external --no-enforce-https --ignore-urls "/github.com/")
          if [ -n "$BASE_PATH" ]; then args+=(--swap-urls "^${BASE_PATH}:"); fi
          bundle exec htmlproofer _site "${args[@]}"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
