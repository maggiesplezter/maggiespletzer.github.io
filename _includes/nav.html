<header class="topbar">
  <a class="topbar-brand" href="{{ site.baseurl }}/">
    <img src="{{ site.baseurl }}{{ site.mark }}" alt="">
    <span class="topbar-text">
      <span class="topbar-name">{{ site.name }}</span>
      <span class="topbar-tagline">{{ site.tagline }}</span>
    </span>
  </a>
  <button class="nav-toggle-btn" popovertarget="nav-menu" aria-expanded="false" aria-label="Menu">
    <span></span>
  </button>
  <nav class="site-nav" aria-label="Main">
    <ul id="nav-menu" popover="auto">
      <li><a href="{{ site.baseurl }}/" {% if page.url == "/" %}aria-current="page"{% endif %}>home</a></li>
      <li class="has-sub{% if page.gallery %} is-current{% endif %}">
        <button type="button" class="sub-toggle" aria-expanded="false" aria-controls="gallery-menu">gallery</button>
        <ul class="sub-menu" id="gallery-menu">
          {% for g in site.data.galleries %}{% if g.hidden %}{% continue %}{% endif %}
          <li><a href="{{ site.baseurl }}/gallery/{{ g.id }}/" {% if page.gallery == g.id %}aria-current="page"{% endif %}>{{ g.title }}</a></li>
          {% endfor %}
        </ul>
      </li>
      <li><a href="{{ site.baseurl }}/about/" {% if page.url == "/about/" %}aria-current="page"{% endif %}>about</a></li>
      <li><a href="https://github.com/{{ site.github_user }}" target="_blank" rel="noopener noreferrer">github <span class="sr-only">(opens in new tab)</span></a></li>
      <li class="nav-social">{% include social-links.html %}</li>
    </ul>
  </nav>
</header>
<script>
  document.getElementById('nav-menu').addEventListener('toggle', e => {
    document.querySelector('.nav-toggle-btn').setAttribute('aria-expanded', e.newState === 'open');
  });
  // Gallery dropdown: opens on hover (CSS) or click/tap; Escape or clicking elsewhere closes it
  (() => {
    const item = document.querySelector('.has-sub');
    const btn = item.querySelector('.sub-toggle');
    const set = open => btn.setAttribute('aria-expanded', String(open));
    btn.addEventListener('click', () => set(btn.getAttribute('aria-expanded') !== 'true'));
    document.addEventListener('click', e => { if (!item.contains(e.target)) set(false); });
    item.addEventListener('keydown', e => { if (e.key === 'Escape') { set(false); btn.focus(); } });
    item.addEventListener('focusout', e => { if (!item.contains(e.relatedTarget)) set(false); });
  })();
</script>
