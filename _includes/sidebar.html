<div class="sidebar-inner">
  <a class="mark" href="{{ site.baseurl }}/" aria-label="{{ site.name }} — home">
    <img src="{{ site.baseurl }}{{ site.mark }}" alt="">
  </a>
  <p class="site-name"><a href="{{ site.baseurl }}/">{% assign parts = site.name | split: " " %}{% for w in parts %}<span>{{ w }}</span> {% endfor %}</a></p>
  <p class="tagline">{{ site.tagline }}</p>
  <nav aria-label="Elsewhere online">
    {% include social-links.html %}
  </nav>
</div>
