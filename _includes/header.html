<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5EFE3">
  <meta name="author" content="{{ site.author }}">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:locale" content="en_US">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}">
  <meta property="og:url" content="{{ site.url | append: page.url }}">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  {% assign og = site.data.photos | where: "featured", true | first %}
  {% if og %}<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/photos/{{ og.gallery }}/{{ og.file }}">{% endif %}
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="{{ site.baseurl }}/assets/fonts/cormorant-garamond.woff" as="font" type="font/woff" crossorigin>
  <link href="{{ site.baseurl }}/assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="{{ site.baseurl }}{{ site.mark }}">
  <link rel="canonical" href="{{ site.url | append: page.url }}">
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
