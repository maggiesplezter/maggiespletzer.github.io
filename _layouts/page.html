{% include header.html %}
<div class="shell">
  <aside class="sidebar" aria-label="About {{ site.name }}">
    {% include sidebar.html %}
  </aside>

  <div class="main-col">
    {% include nav.html %}
    <main id="main-content" class="content{% if page.wide %} content-wide{% endif %}">
      {% if page.title and page.hide_title != true %}<h1 class="page-title">{{ page.title }}</h1>{% endif %}
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
</div>
<script src="{{ site.baseurl }}/assets/js/lightbox.js" defer></script>
</body>

</html>
